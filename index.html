<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대연마루</title>
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; background: #F0F5F1; min-height: 100vh; overscroll-behavior: none; }

    /* ===== SCREEN SWITCHING ===== */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ===== HEADER ===== */
    .app-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      height: 56px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
      transition: background 0.3s;
    }
    .app-header.tab-order   { background: #1B4332; }
    .app-header.tab-kitchen { background: #92400E; }
    .app-header.tab-history { background: #4C1D95; }
    .header-left { display: flex; align-items: center; gap: 8px; color: #fff; }
    .header-icon { font-size: 1.3rem; }
    .header-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .header-badge {
      padding: 5px 12px; border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; color: #fff;
      background: rgba(255,255,255,0.22);
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 999px; background: #6EE7B7;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .sync-pill {
      font-size: 0.62rem; font-weight: 700; padding: 2px 8px;
      border-radius: 999px; color: #fff; cursor: default; white-space: nowrap;
      background: rgba(255,255,255,0.2);
    }
    .sync-pill.cloud { background: rgba(110,231,183,0.35); }
    .sync-pill.local { background: rgba(255,255,255,0.22); }
    .sync-pill.error { background: #DC2626; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
      height: 62px; background: #fff;
      display: flex; border-top: 1px solid #E5E7EB;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      border: none; background: transparent; cursor: pointer;
      transition: background 0.15s; position: relative;
    }
    .nav-btn:active { background: #F3F4F6; }
    .nav-icon { font-size: 1.3rem; transition: transform 0.2s; }
    .nav-label { font-size: 0.68rem; font-weight: 600; color: #9CA3AF; transition: color 0.2s; }
    .nav-btn.active .nav-label { color: #1B4332; }
    .nav-btn.active .nav-icon  { transform: scale(1.15); }
    .nav-btn.tab-kitchen.active .nav-label { color: #92400E; }
    .nav-btn.tab-history.active .nav-label { color: #4C1D95; }
    .nav-badge {
      position: absolute; top: 6px; right: calc(50% - 22px);
      background: #EF4444; color: #fff;
      border-radius: 999px; font-size: 0.65rem; font-weight: 800;
      padding: 1px 5px; min-width: 16px; text-align: center;
    }

    /* ===== SHARED PAGE WRAP ===== */
    .page-wrap { padding-top: 56px; padding-bottom: 70px; }

    /* ══════════════════════════════════════════
       ORDER SCREEN
    ══════════════════════════════════════════ */
    #screen-order { background: #F0F5F1; }

    /* Number overlay — scoped between header and bottom nav so tabs stay clickable */
    .num-modal {
      position: fixed; top: 56px; bottom: 62px; left: 0; right: 0; z-index: 160;
      background: rgba(240,245,241,0.97);
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(3px);
    }
    .num-modal.hidden { display: none; }
    .num-modal-box {
      background: #fff; border-radius: 20px;
      padding: 32px 24px; width: 92%; max-width: 460px;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      border: 1px solid #E5E7EB;
    }
    .num-modal-box .logo-icon { font-size: 2.2rem; margin-bottom: 6px; }
    .num-modal-box h2 { font-size: 1.45rem; font-weight: 800; color: #1B4332; margin-bottom: 4px; }
    .num-modal-box p  { font-size: 0.9rem; color: #9CA3AF; margin-bottom: 22px; }
    .num-modal-note {
      margin-top: 16px; font-size: 0.72rem; color: #9CA3AF; line-height: 1.5;
    }
    .num-grid {
      display: grid; grid-template-columns: repeat(6, 1fr);
      gap: 7px; margin-bottom: 20px;
    }
    .num-btn {
      aspect-ratio: 1; border: 2px solid #E5E7EB;
      background: #fff; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; color: #374151;
      cursor: pointer; transition: all 0.15s;
    }
    .num-btn:hover  { border-color: #40916C; color: #40916C; background: #F0FDF4; }
    .num-btn.sel    { background: #1B4332; border-color: #1B4332; color: #fff; }
    .start-btn {
      width: 100%; padding: 14px;
      background: #1B4332; color: #fff;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 800; cursor: pointer;
    }
    .start-btn:disabled { background: #D1D5DB; color: #9CA3AF; cursor: not-allowed; }

    /* Menu */
    .menu-wrap { padding: 12px 14px 240px; max-width: 920px; margin: 0 auto; padding-top: 68px; }
    .sec-head {
      display: flex; align-items: center; gap: 8px;
      margin: 20px 0 10px;
    }
    .sec-head-icon { font-size: 1.2rem; }
    .sec-head-title {
      font-size: 0.88rem; font-weight: 800; color: #1B4332;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .sec-line { flex: 1; height: 2px; background: #D1FAE5; border-radius: 2px; }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .menu-card {
      background: #fff; border-radius: 14px; padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border: 2px solid transparent; transition: border-color 0.2s;
    }
    .menu-card:hover { border-color: #A7F3D0; }
    .card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 10px;
    }
    .item-en  { font-size: 0.98rem; font-weight: 700; color: #111827; }
    .item-tag {
      display: inline-block; margin-left: 4px; vertical-align: 2px;
      font-size: 0.62rem; font-weight: 800; color: #B45309;
      background: #FEF3C7; padding: 1px 6px; border-radius: 999px;
    }
    .item-prc { font-size: 1rem; font-weight: 800; color: #1B4332; white-space: nowrap; }
    .temp-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .temp-btn {
      flex: 1; padding: 6px 0;
      border: 2px solid #E5E7EB; border-radius: 8px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer; background: #fff;
      transition: all 0.15s;
    }
    .temp-btn.ice          { color: #3B82F6; }
    .temp-btn.ice.active   { background: #EFF6FF; border-color: #3B82F6; }
    .temp-btn.hot          { color: #EF4444; }
    .temp-btn.hot.active   { background: #FEF2F2; border-color: #EF4444; }
    .card-btm { display: flex; align-items: center; gap: 6px; }
    .qty-wrap { display: flex; align-items: center; gap: 5px; }
    .qty-btn {
      width: 28px; height: 28px; background: #F3F4F6;
      border: none; border-radius: 7px; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { background: #D1FAE5; color: #1B4332; }
    .qty-num { font-size: 0.95rem; font-weight: 700; min-width: 20px; text-align: center; }
    .add-btn {
      margin-left: auto; padding: 6px 16px;
      background: #1B4332; color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    .add-btn:hover { background: #2D6A4F; }

    /* Cart panel */
    .cart-panel {
      position: fixed; bottom: 62px; left: 0; right: 0; z-index: 150;
      background: #fff; border-top: 3px solid #1B4332;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
      max-height: 55vh; display: flex; flex-direction: column;
    }
    .cart-panel.screen-hidden { display: none; }
    .cart-head {
      padding: 10px 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      background: #F0FDF4; border-bottom: 1px solid #D1FAE5;
      flex-shrink: 0;
    }
    .cart-head-l { display: flex; align-items: center; gap: 8px; }
    .cart-head-title { font-size: 0.95rem; font-weight: 700; color: #1B4332; }
    .cart-cnt {
      background: #1B4332; color: #fff;
      border-radius: 999px; padding: 1px 8px; font-size: 0.75rem; font-weight: 700;
    }
    .cart-body { overflow-y: auto; padding: 0 14px; flex: 1; }
    .cart-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px solid #F3F4F6; gap: 6px;
    }
    .cart-item-name  { font-size: 0.88rem; font-weight: 600; color: #111827; }
    .cart-item-sub   { font-size: 0.75rem; color: #9CA3AF; margin-top: 1px; }
    .cart-item-price { font-size: 0.88rem; font-weight: 700; color: #1B4332; white-space: nowrap; }
    .cart-del { background: none; border: none; color: #D1D5DB; font-size: 0.9rem; cursor: pointer; padding: 2px 4px; }
    .cart-del:hover { color: #EF4444; }
    .cart-foot {
      padding: 10px 14px; border-top: 2px solid #D1FAE5;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .cart-total-lbl  { font-size: 0.78rem; color: #6B7280; }
    .cart-total-amt  { font-size: 1.2rem; font-weight: 800; color: #1B4332; }
    .cart-account {
      padding: 6px 14px; background: #F9FAFB; border-top: 1px solid #F3F4F6;
      font-size: 0.72rem; color: #6B7280; text-align: center; flex-shrink: 0;
    }
    .order-btn {
      padding: 11px 24px; background: #1B4332; color: #fff;
      border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 800; cursor: pointer;
    }
    .order-btn:hover:not(:disabled) { background: #2D6A4F; }
    .order-btn:disabled { background: #D1D5DB; color: #9CA3AF; cursor: not-allowed; }
    .cart-empty { text-align: center; padding: 18px; color: #9CA3AF; font-size: 0.85rem; }

    /* ══════════════════════════════════════════
       KITCHEN SCREEN
    ══════════════════════════════════════════ */
    #screen-kitchen { background: #FFFBF5; }
    .kitchen-wrap { padding: 12px 14px; max-width: 1000px; margin: 0 auto; }
    .k-action-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .k-action-bar h2 { font-size: 1rem; color: #92400E; font-weight: 800; flex: 1; }
    .k-sel-all-btn {
      padding: 7px 14px; background: #fff;
      border: 2px solid #D97706; color: #D97706;
      border-radius: 8px; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    .k-sel-all-btn:hover { background: #FFFBEB; }
    .k-done-btn {
      padding: 9px 22px; background: #16A34A; color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 800; cursor: pointer;
    }
    .k-done-btn:hover:not(:disabled) { background: #15803D; }
    .k-done-btn:disabled { background: #D1D5DB; color: #9CA3AF; cursor: not-allowed; }
    .k-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
      gap: 12px;
    }
    .k-card {
      background: #fff; border-radius: 14px;
      border: 3px solid #FED7AA;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden; cursor: pointer; transition: all 0.2s;
    }
    .k-card:hover   { border-color: #F97316; transform: translateY(-2px); }
    .k-card.sel     { border-color: #16A34A; background: #F0FDF4; }
    .k-card.fading  { opacity: 0; transform: scale(0.88); transition: all 0.38s; }
    .k-card-head {
      padding: 9px 13px; background: #FFF7ED;
      border-bottom: 2px solid #FED7AA;
      display: flex; align-items: center; justify-content: space-between;
    }
    .k-card.sel .k-card-head { background: #DCFCE7; border-color: #86EFAC; }
    .k-cust { font-size: 0.95rem; font-weight: 800; color: #92400E; }
    .k-time { font-size: 0.72rem; color: #9CA3AF; }
    .k-check {
      width: 22px; height: 22px; border-radius: 999px;
      border: 2px solid #D1D5DB; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; color: transparent; transition: all 0.15s;
    }
    .k-card.sel .k-check { border-color: #16A34A; background: #16A34A; color: #fff; }
    .k-card-body { padding: 8px 13px; }
    .k-item-row {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 0; border-bottom: 1px solid #FEF3C7;
    }
    .k-item-row:last-child { border-bottom: none; }
    .k-temp-tag {
      font-size: 0.68rem; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; white-space: nowrap;
    }
    .k-temp-tag.ice  { background: #EFF6FF; color: #3B82F6; }
    .k-temp-tag.hot  { background: #FEF2F2; color: #EF4444; }
    .k-temp-tag.none { background: #F3F4F6; color: #6B7280; }
    .k-item-name { flex: 1; font-size: 0.88rem; font-weight: 600; color: #1F2937; }
    .k-item-qty  {
      font-size: 0.8rem; font-weight: 700; color: #D97706;
      background: #FFFBEB; padding: 2px 7px; border-radius: 6px;
    }
    .k-del-order {
      background: none; border: none; cursor: pointer;
      font-size: 0.95rem; line-height: 1; padding: 4px 6px;
      border-radius: 7px; opacity: 0.4; transition: all 0.15s;
    }
    .k-del-order:hover { opacity: 1; background: #FEE2E2; }
    .k-del-item {
      background: none; border: none; cursor: pointer;
      color: #D1D5DB; font-size: 0.85rem; font-weight: 700;
      padding: 2px 6px; border-radius: 5px; transition: all 0.15s;
    }
    .k-del-item:hover { color: #EF4444; background: #FEF2F2; }
    .k-empty {
      text-align: center; padding: 70px 20px; color: #9CA3AF;
      grid-column: 1 / -1;
    }
    .k-empty-icon  { font-size: 3.5rem; margin-bottom: 10px; }
    .k-empty-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }

    /* ══════════════════════════════════════════
       HISTORY SCREEN
    ══════════════════════════════════════════ */
    #screen-history { background: #F5F3FF; }
    .hist-wrap { padding: 12px 14px; max-width: 1000px; margin: 0 auto; }
    .summary-row {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px; margin-bottom: 18px;
    }
    .sum-card {
      background: #fff; border-radius: 12px; padding: 14px 12px;
      text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .sum-lbl { font-size: 0.7rem; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
    .sum-val { font-size: 1.4rem; font-weight: 800; }
    .sum-val.purple { color: #7C3AED; }
    .sum-val.green  { color: #16A34A; }
    .sum-val.orange { color: #D97706; }
    .sum-val.blue   { color: #2563EB; }
    .filter-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filt-lbl  { font-size: 0.78rem; color: #6B7280; }
    .filt-sel {
      padding: 6px 10px; border: 2px solid #DDD6FE;
      border-radius: 8px; font-size: 0.82rem; background: #fff;
      color: #374151; cursor: pointer;
    }
    .clear-hist-btn {
      margin-left: auto; padding: 6px 12px; background: #EDE9FE;
      border: none; border-radius: 8px;
      color: #7C3AED; font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    .clear-hist-btn:hover { background: #DDD6FE; }
    .order-list { display: flex; flex-direction: column; gap: 10px; }
    .hist-row {
      background: #fff; border-radius: 12px;
      border: 2px solid #EDE9FE;
      box-shadow: 0 2px 7px rgba(0,0,0,0.05); overflow: hidden;
    }
    .hist-row.completed { border-color: #BBF7D0; }
    .hist-row.partial   { border-color: #FDE68A; }
    .hist-row.pending   { border-color: #FCA5A5; }
    .hist-row-head {
      padding: 11px 14px;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .hist-row.completed .hist-row-head { background: #F0FDF4; }
    .hist-row.partial   .hist-row-head { background: #FFFBEB; }
    .hist-row.pending   .hist-row-head { background: #FFF1F2; }
    .h-dot { width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; }
    .h-dot.completed { background: #22C55E; }
    .h-dot.partial   { background: #F59E0B; }
    .h-dot.pending   { background: #F87171; }
    .h-cust-num { font-size: 0.95rem; font-weight: 800; color: #1F2937; }
    .h-time     { font-size: 0.72rem; color: #9CA3AF; margin-top: 1px; }
    .h-status-chip {
      font-size: 0.7rem; font-weight: 700; padding: 3px 8px;
      border-radius: 999px; white-space: nowrap;
    }
    .h-status-chip.completed { background: #DCFCE7; color: #16A34A; }
    .h-status-chip.partial   { background: #FEF9C3; color: #B45309; }
    .h-status-chip.pending   { background: #FFE4E6; color: #DC2626; }
    .h-total { margin-left: auto; font-size: 1rem; font-weight: 800; }
    .hist-row.completed .h-total { color: #16A34A; }
    .hist-row.partial   .h-total { color: #D97706; }
    .hist-row.pending   .h-total { color: #DC2626; }
    .h-expand { color: #9CA3AF; font-size: 0.75rem; }
    .hist-detail { display: none; border-top: 1px solid #F3F4F6; }
    .hist-detail.open { display: block; }
    .hist-table { width: 100%; border-collapse: collapse; }
    .hist-table th {
      text-align: left; font-size: 0.7rem; color: #9CA3AF;
      text-transform: uppercase; padding: 5px 12px;
      border-bottom: 1px solid #F3F4F6; background: #FAFAFA;
    }
    .hist-table td { padding: 7px 12px; font-size: 0.85rem; border-bottom: 1px solid #F9FAFB; }
    .hist-table tr:last-child td { border-bottom: none; }
    .td-nm  { font-weight: 600; color: #1F2937; }
    .td-sub { text-align: right; font-weight: 700; color: #4C1D95; }
    .t-chip {
      font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .t-chip.ice  { background: #EFF6FF; color: #3B82F6; }
    .t-chip.hot  { background: #FEF2F2; color: #EF4444; }
    .t-chip.none { background: #F3F4F6; color: #6B7280; }
    .item-done-txt    { color: #22C55E; font-size: 0.8rem; font-weight: 700; }
    .item-pending-txt { color: #F87171; font-size: 0.8rem; font-weight: 700; }
    .hist-empty {
      text-align: center; padding: 70px 20px; color: #9CA3AF;
    }
    .hist-empty-icon  { font-size: 3.5rem; margin-bottom: 10px; }
    .hist-empty-title { font-size: 1.1rem; font-weight: 700; color: #6B7280; margin-bottom: 4px; }

    /* ===== ITEMS-SOLD BREAKDOWN (per date) ===== */
    .sold-card {
      background: #fff; border-radius: 12px; padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 2px solid #EDE9FE; margin-bottom: 18px;
    }
    .sold-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .sold-head-icon  { font-size: 1.1rem; }
    .sold-head-title { font-size: 0.92rem; font-weight: 800; color: #5B21B6; }
    .sold-head-date  { margin-left: auto; font-size: 0.78rem; font-weight: 700; color: #7C3AED; }
    .sold-table { width: 100%; border-collapse: collapse; }
    .sold-table th {
      text-align: left; font-size: 0.7rem; color: #9CA3AF; text-transform: uppercase;
      padding: 5px 10px; border-bottom: 1px solid #F3F4F6; background: #FAFAFA;
    }
    .sold-table td { padding: 7px 10px; font-size: 0.85rem; border-bottom: 1px solid #F9FAFB; }
    .sold-table tbody tr:last-child td { border-bottom: none; }
    .sold-rank { color: #9CA3AF; font-weight: 700; width: 24px; }
    .sold-name { font-weight: 600; color: #1F2937; }
    .sold-qty  { font-weight: 800; color: #5B21B6; text-align: center; }
    .sold-rev  { text-align: right; font-weight: 700; color: #16A34A; }
    .sold-temp-mini { font-size: 0.72rem; color: #9CA3AF; font-weight: 600; }
    .sold-foot td { font-weight: 800; color: #1F2937; border-top: 2px solid #EDE9FE; background: #FAF5FF; }

/* ─── CLOUD CONFIG ────────────────────────────────────────────────

   URL이 없으면 이 기기에서만 저장되는 로컬 모드로 동작합니다.      */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMDteZephpg3wm_m8pObKpEDgMtXh42tG0lmF1bA2MZ5wN22zw3smbO-UFFeosu_MEJQ/exec";

/* Drop kitchen selections whose item is no longer pending (changed elsewhere) */

  const valid = new Set();

    if (i.status === "pending") valid.add(`${o.id}::${i.itemId}`);
  }));
  [...kSelected].forEach(k => { if (!valid.has(k)) kSelected.delete(k); });
}

/* ─── SYNC STATUS PILL ─── */
function setSyncStatus(mode) {
  const el = document.getElementById("syncPill");
  if (!el) return;
  if (mode === "cloud")        { el.textContent = "☁️ 동기화";  el.title = "클라우드 동기화 중 — 모든 기기에서 공유됩니다"; el.className = "sync-pill cloud"; }
  else if (mode === "syncing") { el.textContent = "⏳ 연결 중"; el.title = "클라우드에 연결하는 중…";                     el.className = "sync-pill cloud"; }
  else if (mode === "error")   { el.textContent = "⚠️ 오프라인"; el.title = "클라우드 연결 실패 — 재시도 중";             el.className = "sync-pill error"; }
  else                         { el.textContent = "📴 로컬";    el.title = "이 기기에만 저장 — 공유하려면 웹앱 URL을 등록하세요"; el.className = "sync-pill local"; }
}

/* ─── BACKEND: Google Apps Script (cloud) or localStorage (fallback) ─── */
function makeCloudBackend() {
  const POLL_MS = 8000, POLL_MAX_MS = 60000;   // 기본 8초, 연속 실패 시 최대 60초까지
  let inFlight = null, queued = false, failStreak = 0;

  async function post(action, payload) {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      // text/plain keeps this a "simple" request → no CORS preflight
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, payload })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    // 서버가 200으로 응답해도 본문에 ok:false 면 실패로 취급한다
    if (data && data.ok === false) throw new Error(data.error || "서버 오류");
    return data;
  }
  async function doRefresh() {
    try {
      const res = await fetch(APPS_SCRIPT_URL + "?action=list&t=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      applyOrdersSnapshot(data.orders || []);
      failStreak = 0;
      setSyncStatus("cloud");
    } catch (e) {
      console.error("cloud refresh failed", e);
      failStreak++;
      setSyncStatus("error");
    }
  }

  /* 앞 요청이 끝나기 전에는 새로 보내지 않는다.
     Apps Script가 간헐적으로 15~45초까지 느려지므로, 그대로 두면 요청이 쌓여
     실행 한도를 갉아먹고 오래된 응답이 최신 상태를 덮어쓴다.
     진행 중에 요청이 겹치면 끝난 뒤 한 번만 더 돌린다(최신 상태 보장). */
  function refresh() {
    if (inFlight) { queued = true; return inFlight; }
    inFlight = doRefresh().finally(() => {
      inFlight = null;
      if (queued) { queued = false; refresh(); }
    });
    return inFlight;
  }

  /* 응답이 끝난 뒤부터 다음 주기를 센다. 실패가 이어지면 간격을 두 배씩 늘리고,
     한 번이라도 성공하면 기본 간격으로 되돌린다. */
  async function startPolling() {
    for (;;) {
      const wait = Math.min(POLL_MS * Math.pow(2, failStreak), POLL_MAX_MS);
      await new Promise(r => setTimeout(r, wait));
      if (document.visibilityState === "visible") await refresh();
    }
  }

  return {
    cloud: true,
    refresh,
    startPolling,
    add(order)         { return post("add", order).then(refresh); },
    update(id, fields) { return post("update", { id, fields }).then(refresh); },
    remove(id)         { return post("delete", { id }).then(refresh); },
    clearAll()         { return post("clear", {}).then(refresh); },
  };
}

function makeLocalBackend() {
  const KEY = "maru_orders", UP = "maru_update";
  const read  = () => JSON.parse(localStorage.getItem(KEY) || "[]");
  const write = a => { localStorage.setItem(KEY, JSON.stringify(a)); localStorage.setItem(UP, Date.now()); };
  window.addEventListener("storage", e => { if (e.key === KEY || e.key === UP) applyOrdersSnapshot(read()); });
  return {
    cloud: false,
    refresh() { applyOrdersSnapshot(read()); return Promise.resolve(); },
    add(order) {
      const a = read();
      order.id = "order_" + Date.now() + "_" + Math.floor(Math.random() * 1e4);
      a.push(order); write(a); applyOrdersSnapshot(a); return Promise.resolve();
    },
    update(id, fields) {
      const a = read(); const o = a.find(x => x.id === id);
      if (o) Object.assign(o, fields);
      write(a); applyOrdersSnapshot(a); return Promise.resolve();
    },
    remove(id) {
      const a = read().filter(x => x.id !== id);
      write(a); applyOrdersSnapshot(a); return Promise.resolve();
    },
    clearAll() { localStorage.removeItem(KEY); localStorage.setItem(UP, Date.now()); applyOrdersSnapshot([]); return Promise.resolve(); }
  };
}

        </div>` : "";
      const tagHTML = item.tag ? `<span class="item-tag">${item.tag}</span>` : "";
      card.innerHTML = `
        <div class="card-top">
          <div><div class="item-en">${item.name}${tagHTML}</div></div>
          <div class="item-prc">${won(item.price)}</div>
        </div>
        ${tempHTML}
        <div class="card-btm">
          <div class="qty-wrap">
            <button class="qty-btn" onclick="chQty(${item.id},-1)">−</button>
            <span class="qty-num" id="qn-${item.id}">1</span>
            <button class="qty-btn" onclick="chQty(${item.id},1)">+</button>
          </div>
          <button class="add-btn" onclick="addItem(${item.id})">담기 +</button>
        </div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid); wrap.appendChild(sec);
  });
}

function setTemp(id, t) {
  tempMap[id] = t;
  document.getElementById(`ice-${id}`).classList.toggle("active", t === "ice");
  document.getElementById(`hot-${id}`).classList.toggle("active", t === "hot");
}

function chQty(id, d) {
  qtyMap[id] = Math.max(1, qtyMap[id] + d);
  document.getElementById(`qn-${id}`).textContent = qtyMap[id];
}

function addItem(id) {
  if (!custNum) { showToast("손님 번호를 먼저 선택해 주세요"); return; }
  const item = MENU.find(m => m.id === id);
  const temp = item.hasTemp ? tempMap[id] : null;
  const qty  = qtyMap[id];
  const ex   = cart.find(c => c.id === id && c.temp === temp);
  if (ex) ex.qty += qty; else cart.push({ id, name:item.name, price:item.price, temp, qty });
  qtyMap[id] = 1; document.getElementById(`qn-${id}`).textContent = 1;
  renderCart(); showToast(`${item.name} 담김 ✓`);
}

function removeCartItem(i) { cart.splice(i, 1); renderCart(); }

function renderCart() {
  const totalQty  = cart.reduce((s, c) => s + c.qty, 0);
  const totalPrc  = cart.reduce((s, c) => s + c.price * c.qty, 0);
  document.getElementById("cartCnt").textContent = totalQty;
  document.getElementById("cartAmt").textContent = `${totalPrc.toLocaleString("ko-KR")}원`;
  document.getElementById("orderBtn").disabled = cart.length === 0;
  const body = document.getElementById("cartBody");
  if (!cartOpen) { body.innerHTML = ""; return; }
  body.innerHTML = cart.length === 0
    ? `<div class="cart-empty">아직 담은 메뉴가 없습니다</div>`
    : cart.map((c, i) => {
        const tl = c.temp === "ice" ? "🧊 ICE" : c.temp === "hot" ? "🔥 HOT" : "";
        return `<div class="cart-item">
          <div><div class="cart-item-name">${c.name}</div><div class="cart-item-sub">${tl}${tl?" · ":""}수량 ${c.qty}</div></div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="cart-item-price">${won(c.price*c.qty)}</span>
            <button class="cart-del" onclick="removeCartItem(${i})">✕</button>
          </div>
        </div>`;
      }).join("");
}

function toggleCart() {
  cartOpen = !cartOpen;
  document.getElementById("cartArrow").textContent = cartOpen ? "▲" : "▼";
  renderCart();
}

let submitting = false;
async function submitOrder() {
  if (!cart.length || submitting) return;
  const order = {
    customerNumber: custNum,
    timestamp: new Date().toISOString(),
    items: cart.map((c, i) => ({
      itemId: `${Date.now()}_${i}`,
      name: c.name, price: c.price,
      temp: c.temp, qty: c.qty, status: "pending"
    })),
    total: cart.reduce((s, c) => s + c.price * c.qty, 0),
    orderStatus: "pending"
  };
  // 저장이 끝날 때까지 기다린다. 실패하면 장바구니를 그대로 두어 다시 시도할 수 있게 한다
  submitting = true;
  const btn = document.getElementById("orderBtn");
  btn.disabled = true; btn.textContent = "저장 중…";
  try {
    await Backend.add(order);
  } catch (err) {
    console.error(err);
    submitting = false; btn.textContent = "주문하기"; renderCart();
    showToast("⚠️ 저장 실패 — 주문이 남아 있습니다. 다시 눌러 주세요");
    return;
  }
  const n = custNum;
  cart = []; submitting = false; btn.textContent = "주문하기"; renderCart();
  showToast(`손님 #${n} 주문 완료! ✓`);
  setTimeout(() => {
    custNum = null;
    document.querySelectorAll(".num-btn").forEach(b => b.classList.remove("sel"));
    document.getElementById("startBtn").disabled = true;
    document.getElementById("numModal").classList.remove("hidden");
    const badge = document.getElementById("customerBadge");
    if (badge) badge.textContent = "손님 미선택";
  }, 1600);
}

/* ══════════ KITCHEN SCREEN ══════════ */
function getPendingItems() {
  const out = [];
  getOrders().forEach(o => o.items.forEach(i => { if (i.status === "pending") out.push({ order:o, item:i }); }));
  return out;
}

function renderKitchen() {
  const pending = getPendingItems();
  const grid    = document.getElementById("kGrid");
  const badge   = document.getElementById("kHeaderBadge");
  if (badge) badge.textContent = `대기: ${pending.length}`;
  document.getElementById("kTitle").textContent = `대기 중인 주문 (${pending.length})`;
  document.getElementById("kDoneBtn").disabled = kSelected.size === 0;
  updateKNavBadge();

  if (!pending.length) {
    grid.innerHTML = `<div class="k-empty"><div class="k-empty-icon">✅</div><div class="k-empty-title">모든 주문 완료!</div><div>새 주문을 기다리는 중입니다</div></div>`;
    return;
  }
  const byOrder = {};
  pending.forEach(({ order, item }) => {
    if (!byOrder[order.id]) byOrder[order.id] = { order, items: [] };
    byOrder[order.id].items.push(item);
  });
  grid.innerHTML = Object.values(byOrder).map(({ order, items }) => {
    const allSel = items.every(i => kSelected.has(`${order.id}::${i.itemId}`));
    const rows   = items.map(item => {
      const tc = item.temp === "ice" ? "ice" : item.temp === "hot" ? "hot" : "none";
      const tl = item.temp === "ice" ? "🧊 ICE" : item.temp === "hot" ? "🔥 HOT" : "−";
      return `<div class="k-item-row">
        <span class="k-temp-tag ${tc}">${tl}</span>
        <span class="k-item-name">${item.name}</span>
        <span class="k-item-qty">×${item.qty}</span>
        <button class="k-del-item" title="이 메뉴만 삭제"
                onclick="event.stopPropagation();deleteOrderItem('${order.id}','${item.itemId}')">✕</button>
      </div>`;
    }).join("");
    const t = new Date(order.timestamp).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    return `<div class="k-card ${allSel?"sel":""}" id="kc-${order.id}" onclick="kToggle('${order.id}')">
      <div class="k-card-head">
        <div><div class="k-cust">👤 손님 #${order.customerNumber}</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="k-time">${t}</span>
          <button class="k-del-order" title="주문 전체 삭제"
                  onclick="event.stopPropagation();deleteOrder('${order.id}')">🗑</button>
          <div class="k-check">${allSel?"✓":""}</div>
        </div>
      </div>
      <div class="k-card-body">${rows}</div>
    </div>`;
  }).join("");
}

/* 잘못 받은 주문 정리 — 주문 통째로 삭제. 주방·내역 화면이 함께 쓴다 */
function deleteOrder(orderId) {
  const order = getOrders().find(o => o.id === orderId);
  if (!order) return;
  const list = order.items.map(i => `· ${i.name} ×${i.qty}`).join("\n");
  if (!confirm(`손님 #${order.customerNumber} 주문을 통째로 삭제할까요?\n\n${list}\n합계 ${order.total.toLocaleString("ko-KR")}원\n\n되돌릴 수 없습니다.`)) return;
  order.items.forEach(i => kSelected.delete(`${orderId}::${i.itemId}`));
  hExpanded.delete(orderId);
  Backend.remove(orderId)
    .then(() => showToast(`손님 #${order.customerNumber} 주문 삭제됨 ✓`))
    .catch(err => { console.error(err); showToast("⚠️ 삭제 실패 — 연결을 확인해 주세요"); });
}

/* 잘못 받은 주문 정리 — 주문에서 그 메뉴 한 줄만 삭제. 주방·내역 화면이 함께 쓴다 */
function deleteOrderItem(orderId, itemId) {
  const order = getOrders().find(o => o.id === orderId);
  if (!order) return;
  const item = order.items.find(i => i.itemId === itemId);
  if (!item) return;
  const rest = order.items.filter(i => i.itemId !== itemId);
  if (!rest.length) return deleteOrder(orderId);   // 마지막 한 줄이면 주문 자체를 지운다
  if (!confirm(`손님 #${order.customerNumber} 주문에서 「${item.name} ×${item.qty}」을 삭제할까요?\n\n되돌릴 수 없습니다.`)) return;
  kSelected.delete(`${orderId}::${itemId}`);
  const total    = rest.reduce((sum, i) => sum + i.price * i.qty, 0);
  const allDone  = rest.every(i => i.status === "completed");
  const someDone = rest.some(i => i.status === "completed");
  Backend.update(orderId, { items: rest, total, orderStatus: allDone ? "completed" : someDone ? "partial" : "pending" })
    .then(() => showToast(`${item.name} 삭제됨 ✓`))
    .catch(err => { console.error(err); showToast("⚠️ 삭제 실패 — 연결을 확인해 주세요"); });
}

function kToggle(orderId) {
  const orders = getOrders();
  const order  = orders.find(o => o.id === orderId);
  if (!order) return;
  const pItems = order.items.filter(i => i.status === "pending");
  const allSel = pItems.every(i => kSelected.has(`${orderId}::${i.itemId}`));
  pItems.forEach(i => allSel ? kSelected.delete(`${orderId}::${i.itemId}`) : kSelected.add(`${orderId}::${i.itemId}`));
  renderKitchen();
}

function kSelectAll() {
  const p    = getPendingItems();
  const allS = p.length > 0 && p.every(({ order, item }) => kSelected.has(`${order.id}::${item.itemId}`));
  if (allS) kSelected.clear();
  else p.forEach(({ order, item }) => kSelected.add(`${order.id}::${item.itemId}`));
  renderKitchen();
}

function kMarkDone() {
  if (!kSelected.size) return;
  kSelected.forEach(k => {
    const card = document.getElementById(`kc-${k.split("::")[0]}`);
    if (card) card.classList.add("fading");
  });
  // Group selected item ids by order, compute each order's new item list + status
  const byOrder = {};
  kSelected.forEach(k => { const [oid, iid] = k.split("::"); (byOrder[oid] = byOrder[oid] || []).push(iid); });
  const snapshot = getOrders();
  let cnt = 0;
  const updates = [];
  Object.entries(byOrder).forEach(([oid, iids]) => {
    const order = snapshot.find(o => o.id === oid); if (!order) return;
    const items = order.items.map(it => {
      if (iids.includes(it.itemId) && it.status === "pending") { cnt++; return { ...it, status: "completed" }; }
      return it;
    });
    const allDone  = items.every(i => i.status === "completed");
    const someDone = items.some(i => i.status === "completed");
    updates.push({ oid, items, orderStatus: allDone ? "completed" : someDone ? "partial" : "pending" });
  });
  kSelected.clear();
  document.getElementById("kDoneBtn").disabled = true;
  setTimeout(() => {
    Promise.all(updates.map(u => Backend.update(u.oid, { items: u.items, orderStatus: u.orderStatus })))
      .catch(err => { console.error(err); showToast("⚠️ 업데이트 실패 — 연결을 확인해 주세요"); });
    showToast(`${cnt}개 항목 완료 ✓`);
  }, 350);
}

function updateKNavBadge() {
  const cnt = getPendingItems().length;
  const el  = document.getElementById("kNavBadge");
  el.textContent = cnt; el.style.display = cnt > 0 ? "block" : "none";
}

/* ══════════ HISTORY SCREEN ══════════ */
/* Local YYYY-MM-DD key for an ISO timestamp (groups orders by calendar day) */
function dayKey(ts) {
  const d = new Date(ts);
  const m   = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}
/* Friendly date label, e.g. "2026. 8. 27. (목)" */
function dayLabel(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("ko-KR",
    { year: "numeric", month: "short", day: "numeric", weekday: "short" });
}

/* Aggregate items sold for a set of orders → per-menu breakdown panel */
function renderSoldBreakdown(orders, df) {
  const wrap    = document.getElementById("soldBreakdown");
  const dateTxt = df === "all" ? "전체 날짜" : dayLabel(df);
  const map = {};
  orders.forEach(o => o.items.forEach(it => {
    const r = map[it.name] || (map[it.name] = { name: it.name, qty: 0, revenue: 0, ice: 0, hot: 0 });
    r.qty     += it.qty;
    r.revenue += it.price * it.qty;
    if (it.temp === "ice")      r.ice += it.qty;
    else if (it.temp === "hot") r.hot += it.qty;
  }));
  const rows = Object.values(map).sort((a, b) => b.qty - a.qty || b.revenue - a.revenue);

  if (!rows.length) {
    wrap.innerHTML = `<div class="sold-card">
      <div class="sold-head"><span class="sold-head-icon">🧾</span>
        <span class="sold-head-title">메뉴별 판매 집계</span>
        <span class="sold-head-date">${dateTxt}</span></div>
      <div class="sold-empty">해당 날짜에 판매된 메뉴가 없습니다</div>
    </div>`;
    return;
  }
  const totalQty = rows.reduce((s, r) => s + r.qty, 0);
  const totalRev = rows.reduce((s, r) => s + r.revenue, 0);
  const body = rows.map((r, i) => {
    const bits = [];
    if (r.ice) bits.push(`🧊${r.ice}`);
    if (r.hot) bits.push(`🔥${r.hot}`);
    const temp = bits.length ? `<br><span class="sold-temp-mini">${bits.join("&nbsp;&nbsp;")}</span>` : "";
    return `<tr>
      <td class="sold-rank">${i + 1}</td>
      <td class="sold-name">${r.name}${temp}</td>
      <td class="sold-qty">${r.qty}</td>
      <td class="sold-rev">${r.revenue.toLocaleString("ko-KR")}원</td>
    </tr>`;
  }).join("");
  wrap.innerHTML = `<div class="sold-card">
    <div class="sold-head"><span class="sold-head-icon">🧾</span>
      <span class="sold-head-title">메뉴별 판매 집계</span>
      <span class="sold-head-date">${dateTxt}</span></div>
    <table class="sold-table">
      <thead><tr><th>#</th><th>메뉴</th><th style="text-align:center">수량</th><th style="text-align:right">매출</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr class="sold-foot">
        <td></td><td>합계 · ${rows.length}종</td>
        <td class="sold-qty">${totalQty}</td>
        <td class="sold-rev">${totalRev.toLocaleString("ko-KR")}원</td>
      </tr></tfoot>
    </table>
  </div>`;
}

function renderHistory() {
  const allOrders = getOrders();
  const sf   = document.getElementById("fStatus").value;
  const cf   = document.getElementById("fCust").value;
  let   df   = document.getElementById("fDate").value;
  const sort = document.getElementById("fSort").value;

  // Date filter options (newest day first); reset to "all" if the day no longer exists
  const dateEl = document.getElementById("fDate");
  const days   = [...new Set(allOrders.map(o => dayKey(o.timestamp)))].sort((a, b) => b.localeCompare(a));
  if (df !== "all" && !days.includes(df)) df = "all";
  dateEl.innerHTML = `<option value="all">전체 날짜</option>` +
    days.map(d => `<option value="${d}"${df === d ? " selected" : ""}>${dayLabel(d)}</option>`).join("");

  // Customer filter options
  const custEl  = document.getElementById("fCust");
  const curCust = custEl.value;
  const nums    = [...new Set(allOrders.map(o => o.customerNumber))].sort((a,b)=>a-b);
  custEl.innerHTML = `<option value="all">전체</option>` +
    nums.map(n=>`<option value="${n}"${curCust==n?" selected":""}>#${n}</option>`).join("");

  // Orders for the selected day — drives the summary and the items-sold breakdown
  const dateSet = df === "all" ? allOrders : allOrders.filter(o => dayKey(o.timestamp) === df);

  // Summary (reflects the selected date)
  const rev  = dateSet.reduce((s,o)=>s+o.total,0);
  const done = dateSet.filter(o=>o.orderStatus==="completed").length;
  const pend = dateSet.filter(o=>o.orderStatus==="pending").length;
  const avg  = dateSet.length ? Math.round(rev/dateSet.length) : 0;
  document.getElementById("summaryRow").innerHTML = `
    <div class="sum-card"><div class="sum-lbl">총 주문</div><div class="sum-val purple">${dateSet.length}</div></div>
    <div class="sum-card"><div class="sum-lbl">매출</div><div class="sum-val green">${rev.toLocaleString("ko-KR")}원</div></div>
    <div class="sum-card"><div class="sum-lbl">완료</div><div class="sum-val green">${done}</div></div>
    <div class="sum-card"><div class="sum-lbl">대기</div><div class="sum-val orange">${pend}</div></div>
    <div class="sum-card"><div class="sum-lbl">평균</div><div class="sum-val blue">${avg.toLocaleString("ko-KR")}원</div></div>`;

  const hb = document.getElementById("hHeaderBadge");
  if (hb) hb.textContent = `총 ${dateSet.length}건`;

  // What was sold on the selected date
  renderSoldBreakdown(dateSet, df);

  // Per-order list: date → status → customer → sort
  let orders = dateSet.slice();
  const all  = allOrders;
  if (sf !== "all") orders = orders.filter(o=>o.orderStatus===sf);
  if (cf !== "all") orders = orders.filter(o=>o.customerNumber==cf);
  if (sort === "oldest")  orders.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  else if (sort === "newest") orders.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  else orders.sort((a,b)=>b.total-a.total);

  const list = document.getElementById("orderList");
  if (!all.length) {
    list.innerHTML = `<div class="hist-empty"><div class="hist-empty-icon">📋</div><div class="hist-empty-title">주문 내역이 없습니다</div><div>주문 탭에서 주문하면 여기에 표시됩니다</div></div>`;
    return;
  }
  if (!orders.length) {
    list.innerHTML = `<div class="hist-empty"><div class="hist-empty-icon">🔍</div><div class="hist-empty-title">조건에 맞는 주문이 없습니다</div></div>`;
    return;
  }

  const slMap = { completed:["완료","completed"], partial:["진행 중","partial"], pending:["대기","pending"] };
  list.innerHTML = orders.map(order => {
    const [sl, sc]  = slMap[order.orderStatus] || ["대기","pending"];
    const isOpen    = hExpanded.has(order.id);
    const t         = new Date(order.timestamp).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    const detailRows = order.items.map(item => {
      const tc = item.temp==="ice"?"ice":item.temp==="hot"?"hot":"none";
      const tl = item.temp==="ice"?"🧊 ICE":item.temp==="hot"?"🔥 HOT":"−";
      return `<tr>
        <td class="td-nm">${item.name}</td>
        <td><span class="t-chip ${tc}">${tl}</span></td>
        <td>${item.qty}</td>
        <td>${item.status==="completed"?`<span class="item-done-txt">✓ 완료</span>`:`<span class="item-pending-txt">⏳ 대기</span>`}</td>
        <td class="td-sub">${(item.price*item.qty).toLocaleString("ko-KR")}원</td>
        <td style="text-align:right"><button class="k-del-item" title="이 메뉴만 삭제"
            onclick="deleteOrderItem('${order.id}','${item.itemId}')">✕</button></td>
      </tr>`;
    }).join("");
    return `
      <div class="hist-row ${sc}">
        <div class="hist-row-head" onclick="hToggle('${order.id}')">
          <div class="h-dot ${sc}"></div>
          <div><div class="h-cust-num">👤 손님 #${order.customerNumber}</div><div class="h-time">${t}</div></div>
          <span class="h-status-chip ${sc}">${sl}</span>
          <div class="h-total">${order.total.toLocaleString("ko-KR")}원</div>
          <button class="k-del-order" title="주문 전체 삭제"
                  onclick="event.stopPropagation();deleteOrder('${order.id}')">🗑</button>
          <span class="h-expand">${isOpen?"▲":"▼"}</span>
        </div>
        <div class="hist-detail ${isOpen?"open":""}">
          <table class="hist-table">
            <thead><tr><th>메뉴</th><th>온도</th><th>수량</th><th>상태</th><th style="text-align:right">금액</th><th></th></tr></thead>
            <tbody>${detailRows}</tbody>
          </table>
        </div>
      </div>`;
  }).join("");
}

function hToggle(id) {
  hExpanded.has(id) ? hExpanded.delete(id) : hExpanded.add(id);
  renderHistory();
}

function clearHistory() {
  if (!confirm("모든 주문 내역을 삭제할까요? 되돌릴 수 없습니다.")) return;
  hExpanded.clear(); kSelected.clear();
  Backend.clearAll().catch(err => { console.error(err); showToast("⚠️ 삭제 실패 — 연결을 확인해 주세요"); });
}

/* ══════════ TOAST ══════════ */
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

/* ══════════ INIT ══════════ */
renderMenu();
renderCart();
updateKNavBadge();

if (Backend.cloud) {
  setSyncStatus("syncing");
  Backend.refresh();
  // 다른 기기의 변경을 따라잡는 폴링. 화면이 켜져 있을 때만 돌고,
  // 앞 요청이 끝난 뒤에 다음 주기를 세므로 느려져도 요청이 쌓이지 않는다.
  Backend.startPolling();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") Backend.refresh();
  });
} else {
  setSyncStatus("local");
  Backend.refresh();   // load from localStorage
}
</script>
</body>
</html>
